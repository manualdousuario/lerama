name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify for a release
        type: string
        required: false
  push:
    branches: ['**']
  pull_request:

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none

      - name: Validate PHP syntax
        run: git ls-files | grep '\.php$' | xargs -P4 -I{} php -l {}

  tests:
    name: Pest
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lerama_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, mysqlnd, pdo_mysql, gd, intl
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --optimize-autoloader

      - name: Composer audit
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  image:
    name: Image smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Smoke test
        run: |
          docker run --rm --entrypoint php app:ci artisan --version | grep -F 'Laravel Framework'
